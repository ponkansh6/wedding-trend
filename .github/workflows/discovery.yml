name: Daily Discovery Crawler

on:
  # plan 07 Stage 0（必須統制 M1〜M6）の意図的破壊テストまで完了したため、
  # 2026-08-26 に自動スケジュールを有効化した（完了判定は
  # shared_plan/07-unattended-operation.md §11。M1・M3-K2・M4 は
  # 「意図的に発火させて確認した」と記録済み）。
  # なお §8 の較正（golden set）は §13-2 のオーナー判断で明示的に不実施であり、
  # LLM 判定の誤り率が未知のまま運用することを引き受けている。
  # 統制を外す変更を入れる場合は、先にこの schedule を止めること。
  schedule:
    - cron: "0 18 * * *" # Every day at 18:00 UTC (03:00 JST)
  # 手動起動は Stage 0 期間から引き続き残す（障害時の再実行・単発消化用）。
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run discovery crawler
        id: discovery
        run: |
          set +e
           pnpm exec tsx scripts/ops/run-discovery.mjs
          ec=$?
          set -e
          echo "exit_code=${ec}" >> "$GITHUB_OUTPUT"
          if [ "$ec" -eq 0 ] || [ "$ec" -eq 2 ]; then
            exit 0
          fi
          exit "$ec"
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Report soft stop (daily budget exhausted)
        if: steps.discovery.outputs.exit_code == '2'
        run: |
          echo "::notice title=Discovery soft stop::Daily request budget (B1) was exhausted; crawler stopped normally and will resume automatically on the next scheduled run."
          {
            echo "### Discovery Crawler: soft stop (exit 2)"
            echo ""
            echo "日次リクエスト予算（B1）を消化して停止しました。積み残しがある限り毎日発生するのが正常であり、自動的に回復します。"
            echo ""
            echo "- Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open GitHub Issue on Failure
        # exit 2（soft stop）以外の失敗はすべて拾う。exit_code が未設定になる
        # ケース（checkout / pnpm install の失敗、ステップのタイムアウト kill 等）で
        # 無音になるのを防ぐため、'== 1' ではなく "!= 2" で判定する。
        if: failure() && steps.discovery.outputs.exit_code != '2'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🚨 Discovery Crawler Failed";
            const body = `Automated daily discovery crawler run hit a hard stop (exit code 1).\n\n- Workflow run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n- This indicates a kill gate (K1-K6) tripped, or an unexpected error occurred.\n- Check \`host_gate_state\` and the run logs (sitemap discovery / pending URL ingestion). Kill gates require manual human release — do not assume this will self-recover.`;

            // Check if an open issue with this title already exists to avoid spamming
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: ["automated-alert"]
            });

            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              console.log(`Updating existing issue #${existing.number}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Another failure occurred in run ${context.runId}.`
              });
            } else {
              console.log("Creating new alert issue");
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["automated-alert"]
              });
            }
