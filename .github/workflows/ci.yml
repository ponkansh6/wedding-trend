name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # HTTP/build/RSC coverage is intentionally separate from the sandbox-safe
      # contract smoke run by verify and must remain required in CI.
      - run: bash scripts/gates/smoke-test-http.sh
